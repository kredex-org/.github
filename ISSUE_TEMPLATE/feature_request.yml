name: ✨ Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have a bigger idea? Consider starting a thread in [Discussions → Ideas](https://github.com/orgs/kredex-org/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected (borrower, lender, admin, contributor)?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / UX
        - Backend / API
        - Smart contracts
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to help implement this
