name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏
        **Security vulnerability?** Do NOT file it here. See our [Security Policy](https://github.com/kredex-org/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, wallet and version, network (Testnet), Node/Rust version if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or transaction hash
      description: Paste console output or a Stellar Expert link. **Never paste secret keys.**
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I have not included any secret keys or private data
          required: true
        - label: I'd like to work on fixing this myself
          required: false
