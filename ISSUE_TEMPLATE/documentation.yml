name: 📝 Documentation improvement
description: Report unclear, missing or incorrect docs (great first contribution!)
labels: ["documentation", "good first issue"]
body:
  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: Link to the page or file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to submit a PR for this
