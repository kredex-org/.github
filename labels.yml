# Standard label set for Kredex Org repositories.
# Sync with a tool such as https://github.com/EndBug/label-sync or `gh label create`.
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "difficulty: beginner"
  color: "c2e0c6"
  description: "No deep project knowledge required"
- name: "difficulty: intermediate"
  color: "fef2c0"
  description: "Some familiarity with the codebase needed"
- name: "difficulty: advanced"
  color: "f9d0c4"
  description: "Deep knowledge of the system required"
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "security"
  color: "b60205"
  description: "Security-related (public hardening only; report vulnerabilities privately)"
- name: "area: contracts"
  color: "1d76db"
  description: "Soroban smart contracts"
- name: "area: product"
  color: "5319e7"
  description: "Web application"
- name: "area: docs"
  color: "0e8a16"
  description: "Documentation site"
- name: "area: ci"
  color: "bfdadc"
  description: "CI/CD and tooling"
- name: "needs triage"
  color: "ededed"
  description: "Awaiting maintainer review"
- name: "needs reproduction"
  color: "fbca04"
  description: "Cannot reproduce yet"
- name: "blocked"
  color: "000000"
  description: "Blocked by another issue or decision"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue already exists"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
